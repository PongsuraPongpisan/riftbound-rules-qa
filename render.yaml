# Render blueprint: https://render.com/docs/blueprint-spec
# Builds the app, downloads + parses the official Core Rules, then serves the web page and API.
services:
  - type: web
    name: riftbound-rules-qa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m scripts.fetch_rules
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_API_KEY
        sync: false      # entered in the Render dashboard, never committed
      - key: OPENAI_BASE_URL
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "6"
      - key: DAILY_LIMIT
        value: "300"
